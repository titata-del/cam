<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#f6eee9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Luma" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="stylesheet" href="styles.css?v=8" />
  <title>Luma Camera</title>
</head>
<body>
  <div id="lockScreen" class="screen lock-screen">
    <div class="lock-card">
      <div class="mini-logo">L</div>
      <h1>Luma</h1>
      <p class="muted">ton appareil photo privé</p>
      <div id="dots" class="dots" aria-label="Code"></div>
      <div class="keypad" id="keypad"></div>
      <p id="lockMessage" class="lock-message"></p>
    </div>
  </div>

  <div id="app" class="screen app hidden">
    <header class="topbar">
      <button id="gridBtn" class="icon-btn">#</button>
      <div class="brand">Luma <span id="buildVersion" style="font:500 9px -apple-system;color:#9b8d88;vertical-align:middle">v2.6</span></div>
      <button id="switchBtn" class="icon-btn switch-camera" aria-label="Retourner la caméra">⇄</button>
    </header>

    <main>
      <section id="cameraView" class="view active">
        <div class="camera-stage">
          <video id="video" autoplay muted playsinline></video>
          <img id="traceImage" class="trace-image hidden" alt="" />
          <div id="grid" class="grid-overlay hidden">
            <i></i><i></i><i></i><i></i>
          </div>
          <div id="focusRing" class="focus-ring hidden"></div>
          <div id="cameraError" class="camera-error hidden"></div>

          <div class="camera-tools">
            <label class="pill">
              Calque
              <input id="traceInput" type="file" accept="image/*" hidden />
            </label>
            <label id="traceOpacityWrap" class="opacity-wrap hidden">
              <input id="traceOpacity" type="range" min="5" max="90" value="38" />
            </label>
            <button id="removeTraceBtn" class="pill hidden" type="button">Retirer</button>
          </div>

          <div id="zoomButtons" class="zoom-buttons"></div>

          <div class="filter-strip-wrap">
            <div id="filterStrip" class="filter-strip"></div>
          </div>
        </div>

        <div class="capture-bar">
<button id="shutterBtn" class="shutter" aria-label="Prendre une photo"><span></span></button>
          <button id="editFiltersBtn" class="round-mini" title="Créer un filtre">✦</button>
</div>
      </section>

      <section id="galleryView" class="view">
        <div class="section-head">
          <div>
            <h2>Galerie</h2>
            <p class="muted">tes photos, albums et favoris</p>
          </div>
          <div class="gallery-actions">
            <button id="newAlbumBtn" class="soft-btn">+ Album</button>
            <button id="compareModeBtn" class="soft-btn">Comparer</button>
          </div>
        </div>

        <div class="gallery-tabs">
          <button class="gallery-tab active" data-gallery-filter="all">Toutes</button>
          <button class="gallery-tab" data-gallery-filter="favorites">Favoris</button>
          <button class="gallery-tab" data-gallery-filter="albums">Albums</button>
        </div>

        <div id="albumList" class="album-list hidden"></div>
        <div id="galleryGrid" class="gallery-grid"></div>
        <div id="emptyGallery" class="empty-state">
          <div class="empty-icon">♡</div>
          <p>Ta galerie commence ici.</p>
        </div>
      </section>

      <section id="filtersView" class="view">
        <div class="section-head">
          <div>
            <h2>Créer un filtre</h2>
            <p class="muted">crée ton propre rendu</p>
          </div>
        </div>

        <div class="editor-card">
          <div class="filter-preview-shell">
            <div class="preview-wrap">
              <video id="filterPreview" autoplay muted playsinline></video>
              <div id="filterPreviewFx" class="filter-preview-fx"></div>
            </div>
          </div>

          <label class="filter-name-row">Nom
            <input id="customFilterName" maxlength="24" placeholder="mon filtre" />
          </label>

          <div class="apple-adjustments">
            <div class="adjustment-strip-wrap">
              <div id="adjustmentStrip" class="adjustment-strip"></div>
              <input id="adjustmentScroll" class="adjustment-scroll" type="range" min="0" max="100" value="0" aria-label="Défilement des réglages">
            </div>
            <div class="active-adjustment">
              <div class="adjustment-head">
                <span id="activeAdjustmentName">Exposition</span>
                <span id="activeAdjustmentValue">0</span>
              </div>
              <input id="activeAdjustmentSlider" class="apple-slider" type="range" min="-100" max="100" value="0">
            </div>
          </div>

          <button id="saveFilterBtn" class="primary-btn filter-save-btn">Enregistrer le filtre</button>
</div>

        <div class="section-head second">
          <div><h2>Mes filtres</h2></div>
        </div>
        <div id="myFilters" class="my-filters"></div>
      </section>
    </main>

    <nav class="tabbar">
      <button class="tab active" data-view="cameraView">Caméra</button>
      <button class="tab" data-view="galleryView">Galerie</button>
      <button class="tab" data-view="filtersView">Filtres</button>
    </nav>
  </div>

  <div id="compareOverlay" class="compare-overlay hidden">
    <button id="closeCompare" class="compare-close">×</button>
    <div class="compare-inner">
      <div class="compare-title">Comparer</div>
      <div class="compare-stage">
        <img id="compareA" alt="A">
        <img id="compareB" class="compare-b" alt="B">
        <div id="compareDivider" class="compare-divider"></div>
        <input id="compareSlider" type="range" min="0" max="100" value="50">
      </div>
      <div class="compare-labels"><span>A</span><span>B</span></div>
    </div>
  </div>

  
  <div id="viewerOverlay" class="viewer-overlay hidden">
    <button id="closeViewer" class="viewer-close">×</button>
    <div class="viewer-inner">
      <img id="viewerImage" alt="">
      <div class="viewer-actions">
        <button id="viewerFavorite" class="viewer-action">♡ Favori</button>
        <button id="viewerAddAlbum" class="viewer-action">＋ Album</button>
        <button id="viewerDelete" class="viewer-action danger">Supprimer</button>
      </div>
    </div>
  </div>

  <div id="albumOverlay" class="album-overlay hidden">
    <div class="album-card">
      <h3 id="albumOverlayTitle">Nouvel album</h3>
      <input id="albumNameInput" placeholder="ex. soirées d’été" maxlength="30">
      <div id="albumChoices" class="album-choices hidden"></div>
      <div class="album-card-actions">
        <button id="cancelAlbumBtn" class="soft-btn">Annuler</button>
        <button id="confirmAlbumBtn" class="primary-btn inline">Enregistrer</button>
      </div>
    </div>
  </div>

  <div id="shutterFlash" class="shutter-flash"></div>
<canvas id="canvas" hidden></canvas>
  <script src="app.js?v=8"></script>
</body>
</html>
